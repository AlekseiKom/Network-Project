<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e234e" />
      <stop offset="50%" stop-color="#0a1532" />
      <stop offset="100%" stop-color="#050b1a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Tile with iOS-style squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />

  <!-- Network Interconnection Lines -->
  <g stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <!-- Central Switch/Router Hub -->
    <line x1="32" y1="20" x2="18" y2="44" />
    <line x1="32" y1="20" x2="46" y2="44" />
    <line x1="18" y1="44" x2="46" y2="44" />
  </g>

  <!-- Network Nodes (Servers / Switches / Clients) -->
  <!-- Top Node (Gateway / Cloud Router) -->
  <circle cx="32" cy="20" r="6.5" fill="#0f2654" stroke="#38bdf8" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="32" cy="20" r="2.5" fill="#38bdf8" />

  <!-- Bottom Left Node (Server Host) -->
  <circle cx="18" cy="44" r="5.5" fill="#0f2654" stroke="#60a5fa" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="18" cy="44" r="2" fill="#60a5fa" />

  <!-- Bottom Right Node (Client / Host) -->
  <circle cx="46" cy="44" r="5.5" fill="#0f2654" stroke="#a855f7" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="46" cy="44" r="2" fill="#c084fc" />

  <!-- Data Packet Accents -->
  <circle cx="25" cy="32" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="39" cy="32" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="32" cy="44" r="1.5" fill="#38bdf8" opacity="0.9" />
</svg>
